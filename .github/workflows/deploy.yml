name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but let an in-flight one finish rather
# than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The site is only published if the checks that protect its correctness
      # pass. A broken build should never reach a student.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

      - name: Build static export
        run: npm run build
        env:
          # A project site is served from /<repo>, so the app needs a base path.
          # Both values are derived from the repository rather than hardcoded,
          # so a fork or a rename keeps working.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      # Deliberately after the build: this is the one step that needs Pages to
      # already be switched on for the repository, and putting it last means a
      # run still proves the build and tests are green even when publishing is
      # blocked.
      #
      # One-time setup: Settings -> Pages -> Build and deployment ->
      # Source: "GitHub Actions". The workflow token is not permitted to create
      # the Pages site itself, which is why this is not automated.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
